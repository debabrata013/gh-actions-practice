<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1d4ed8, #9333ea);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }
    .card {
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      padding: 2rem 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
    }
    p {
      margin: 0;
      font-size: 1rem;
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to Our Landing Page</h1>
    <p>Everything is set up beautifully and running smooth.</p>
  </div>
</body>
</html>
